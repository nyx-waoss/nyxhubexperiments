<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToDo Nyx</title>
<link rel="icon" type="image/x-icon" href="/public/pendientesdashboard/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/public/pendientesdashboard/manifest.json">
<meta name="theme-color" content="#1b2038">
</head>
<body>
<div class="bg"></div>

<div id="nioContainer">
    <div class="lastResponse">
        <p class="nioResponse">
            Claro que si! He agregado la tarea para ti!
        </p>
    </div>
    <div class="input">
        <span class="userInput">Puedes agregar una tarea de...</span>
    </div>
</div>

<main class="app">
  <header class="top">
    <div>
      <h1><span id="hello">Buenos días</span>, <span id="name" contenteditable="true" spellcheck="false" title="Toca para cambiar tu nombre">Pepe</span></h1>
      <p id="sub" class="muted"></p>
    </div>
    <button class="btn secondary" id="invokeNioBtn"><i class="fi fi-rr-circle-microphone"></i></button>
    <button class="btn primary" id="add"><i class="fi fi-rr-plus"></i><span>Nueva tarea</span></button>
  </header>

  <section class="grid">
    <article class="card clock" style="--i:0">
      <div class="card-title"><i class="fi fi-rr-clock"></i>Hora</div>
      <div class="time"><span id="hm">00:00</span><small id="sec">00</small></div>
      <div class="muted" id="date"></div>
    </article>

    <article class="card weather" style="--i:1">
      <div class="card-title"><i class="fi fi-rr-cloud-sun"></i>Clima</div>
      <div class="w-row">
        <i class="fi fi-rr-cloud-sun w-icon" id="w-icon"></i>
        <div>
          <div class="temp" id="w-temp">--°</div>
          <div class="muted" id="w-desc">Clima</div>
        </div>
      </div>
      <div class="w-extra muted" id="w-extra"></div>
    </article>

    <article class="card progress" style="--i:2">
      <div class="card-title"><i class="fi fi-rr-chart-pie-alt"></i>Progreso de hoy</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100" class="ring">
          <circle cx="50" cy="50" r="42" class="ring-bg"/>
          <circle cx="50" cy="50" r="42" class="ring-fg" id="ring"/>
        </svg>
        <div class="ring-text"><b id="pct">0%</b><span class="muted" id="pct-sub">0 de 0</span></div>
      </div>
    </article>

    <article class="card list today" style="--i:3">
      <div class="card-title"><i class="fi fi-rr-calendar-day"></i>Pronto
        <div class="seg" id="soonFilters">
          <button data-sf="today" class="on">Hoy</button>
          <button data-sf="tomorrow">Mañana</button>
          <button data-sf="in2days">En 2 Días</button>
          <button data-sf="nextweek">Proxima Semana</button>
        </div>
      </div>
      <div class="tasks" id="today"></div>
    </article>

    <article class="card list upcoming" style="--i:4">
      <div class="card-title">
        <i class="fi fi-rr-list-check"></i>Pendientes
        <div class="seg" id="filters">
          <button data-f="all" class="on">Todas</button>
          <button data-f="Tarea">Tareas</button>
          <button data-f="Examen">Exámenes</button>
          <button data-f="Proyecto">Proyectos</button>
          <button data-f="Recordatorio">Avisos</button>
        </div>
      </div>
      <div class="tasks" id="upcoming"></div>
    </article>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="assistant.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<!--<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>-->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyxHub | Contenido Protegido</title>
    <link rel="stylesheet" href="/styleinjected.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/requestAccess/styles.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>
<body>
    <header>
        <span>NyxHub</span>
    </header>
    <main id="main">
        <div class="welcome"><h1>Contenido Protegido</h1><div class="line"></div></div>
        <span>Lo sentimos, para acceder a este archivo necesita ingresar mediante una contraseña.</span>
        <span>Plazo de vencimiento: <strong>2 Días</strong></span>
        <button onclick="verifyAndRedirect()" id="accessButton">Ingresar Contraseña</button>
    </main>
    <div id="textMsgBox" class="hidden">
        <span>Ingrese un valor.</span>
        <input type="text">
        <div class="buttons">
            <button class="cls">Cancelar</button>
            <button class="acp">Confirmar</button>
        </div>
    </div>
    <script src="/scriptinjected.js"></script>
    <script src="/requestAccess/app.js"></script>
</body>
</html>
